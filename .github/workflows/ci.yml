name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per branch: a newer push cancels the older run instead of racing it.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # The ffmpeg packages are cached, so most runs don't need an apt mirror at all.
      - name: Cache ffmpeg packages
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-debs
          key: ffmpeg-debs-v1-${{ runner.os }}-${{ runner.arch }}
      - name: Install ffmpeg (voice note conversion)
        timeout-minutes: 10
        run: |
          # Past hangs gave no output: skip the slow man-db rebuild, wait for a
          # busy dpkg lock instead of stalling, use IPv4 only, time out slow
          # mirrors, and give each attempt a limit. Output stays on so a stall
          # shows where it is. Cached packages go where apt looks first; if the
          # Azure mirror fails once, later attempts use archive.ubuntu.com.
          sudo rm -f /var/lib/man-db/auto-update
          if ls ~/ffmpeg-debs/*.deb >/dev/null 2>&1; then sudo cp ~/ffmpeg-debs/*.deb /var/cache/apt/archives/; fi
          APT="-o DPkg::Lock::Timeout=60 -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for attempt in 1 2 3; do
            if timeout 150 sudo apt-get $APT install -y --no-install-recommends ffmpeg; then break; fi
            [ "$attempt" = 3 ] && exit 1
            # Noble runners read their mirrors from apt-mirrors.txt; older images from the sources files.
            if [ -f /etc/apt/apt-mirrors.txt ]; then echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null; fi
            sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
            timeout 120 sudo apt-get $APT update || true
          done
          ffmpeg -hide_banner -encoders | grep -q libopus
          mkdir -p ~/ffmpeg-debs && cp /var/cache/apt/archives/*.deb ~/ffmpeg-debs/ 2>/dev/null || true
          echo "ffmpeg packages kept for the cache: $(ls ~/ffmpeg-debs | wc -l)"
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Messy-input suite
        run: bun run test:messy
      - name: Everyday voice notes (golden)
        run: bun run test:golden
