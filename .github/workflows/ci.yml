name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install ffmpeg (voice note conversion)
        timeout-minutes: 10
        run: |
          # Past hangs gave no output: skip the slow man-db rebuild, wait for a
          # busy dpkg lock instead of stalling, use IPv4 only (IPv6 mirror
          # connections can stall silently), time out slow mirrors, and give
          # each attempt a limit. Output stays on so a stall shows where it is.
          sudo rm -f /var/lib/man-db/auto-update
          APT="-o DPkg::Lock::Timeout=60 -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for attempt in 1 2 3; do
            if timeout 150 sudo apt-get $APT install -y --no-install-recommends ffmpeg; then break; fi
            timeout 120 sudo apt-get $APT update || true
            [ "$attempt" = 3 ] && exit 1
          done
          ffmpeg -hide_banner -encoders | grep -q libopus
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Messy-input suite
        run: bun run test:messy
